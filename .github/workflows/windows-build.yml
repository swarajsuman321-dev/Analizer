name: Build Windows application
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  windows-exe:
    permissions:
      contents: write
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        id: python
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip
          cache-dependency-path: requirements-build.txt
      - name: Prepare build environment
        shell: pwsh
        run: |
          python -m venv .venv-exe
          .venv-exe\Scripts\python.exe -m pip install --only-binary=:all: -r requirements-build.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .venv-exe\Scripts\python.exe scripts/build_installer.py --check-script
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Check native updates and channel interactions
        shell: pwsh
        run: |
          $output = & .venv-exe\Scripts\python.exe -m unittest discover -s tests -p test_updates.py -v 2>&1
          $code = $LASTEXITCODE
          if ($code -eq 0) {
            $output += & .venv-exe\Scripts\python.exe -m unittest discover -s tests -p test_simplified_workbench.py -k test_checkbox_and_master -v 2>&1
            $code = $LASTEXITCODE
          }
          if ($code -eq 0) {
            $output += & .venv-exe\Scripts\python.exe -m unittest discover -s tests -p test_simplified_workbench.py -k test_real_cursor_mouse_drag -v 2>&1
            $code = $LASTEXITCODE
          }
          if ($code -eq 0) {
            $output += & .venv-exe\Scripts\python.exe -m unittest discover -s tests -p test_installer.py -v 2>&1
            $code = $LASTEXITCODE
          }
          if ($code -eq 0) {
            $output += & .venv-exe\Scripts\python.exe -m unittest discover -s tests -p test_header_navigation_hover.py -v 2>&1
            $code = $LASTEXITCODE
          }
          if ($code -eq 0) {
            $output += & .venv-exe\Scripts\python.exe -m unittest discover -s tests -p test_plot_geometry_alignment.py -v 2>&1
            $code = $LASTEXITCODE
          }
          $output | Write-Output
          if ($code -ne 0) {
            $tail = ($output | Select-Object -Last 35) -join "`n"
            $tail = $tail.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=Native interaction test failure::$tail"
          }
          exit $code
      - name: Restore exact-source tested runtimes
        id: runtime-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            dist/onedir
            dist/ApplianceSignalStudio.exe
            dist/ApplianceSignalStudio_Portable.zip
          key: windows-runtime-v1-${{ runner.arch }}-${{ steps.python.outputs.python-version }}-${{ hashFiles('*.py', '*.spec', 'requirements*.txt', 'version_info.txt', 'app_icon.ico', 'app_logo.png', 'manuals/*.md', 'profiles/*.json') }}
      - name: Build and test portable and single-file executables
        if: steps.runtime-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $output = & .venv-exe\Scripts\python.exe build_exe.py --skip-install 2>&1
          $code = $LASTEXITCODE
          $output | Write-Output
          if ($code -ne 0) {
            $tail = ($output | Select-Object -Last 18) -join "`n"
            $tail = $tail.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            if ($tail.Length -gt 3000) { $tail = $tail.Substring($tail.Length - 3000) }
            Write-Output "::error title=Windows package failure::$tail"
          }
          exit $code
      - name: Revalidate cached runtimes and current tests
        if: steps.runtime-cache.outputs.cache-hit == 'true'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path build -Force | Out-Null
          $tests = & .venv-exe\Scripts\python.exe -c "import sys; from build_exe import run; run([sys.executable, '-m', 'unittest', 'discover', '-s', 'tests', '-v'], timeout=900)" 2>&1
          $testCode = $LASTEXITCODE
          $tests | Tee-Object -FilePath build/native-unit-tests.log
          if ($testCode -ne 0) { exit $testCode }
          .venv-exe\Scripts\python.exe -c "from build_exe import check_bundle,DIST; from app_updates import restart_environment; check_bundle(DIST/'onedir/ApplianceSignalStudio/ApplianceSignalStudio.exe','onedir'); check_bundle(DIST/'ApplianceSignalStudio.exe','onefile'); check_bundle(DIST/'ApplianceSignalStudio.exe','onefile_restart',env=restart_environment())"
          exit $LASTEXITCODE
      - name: Save verified runtimes before installer testing
        if: steps.runtime-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            dist/onedir
            dist/ApplianceSignalStudio.exe
            dist/ApplianceSignalStudio_Portable.zip
          key: ${{ steps.runtime-cache.outputs.cache-primary-key }}
      - name: Build and verify per-user installer lifecycle
        shell: pwsh
        run: |
          $output = & .venv-exe\Scripts\python.exe scripts/build_installer.py 2>&1
          $code = $LASTEXITCODE
          if ($code -eq 0) {
            $output += & .venv-exe\Scripts\python.exe scripts/check_installer.py 2>&1
            $code = $LASTEXITCODE
          }
          $output | Write-Output
          if ($code -ne 0) {
            $tail = ($output | Select-Object -Last 65) -join "`n"
            if ($tail.Length -gt 2600) { $tail = $tail.Substring($tail.Length - 2600) }
            $tail = $tail.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=Installer lifecycle failure::$tail"
          }
          exit $code
      - name: Verify real recording workflows inside all packaged editions
        shell: pwsh
        run: |
          $output = & .venv-exe\Scripts\python.exe scripts/check_windows_acceptance.py 2>&1
          $code = $LASTEXITCODE
          $output | Write-Output
          if ($code -ne 0) {
            $tail = ($output | Select-Object -Last 40) -join "`n"
            if ($tail.Length -gt 2600) { $tail = $tail.Substring($tail.Length - 2600) }
            $tail = $tail.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=Packaged user workflow failure::$tail"
            $diagnostics = & .venv-exe\Scripts\python.exe scripts/check_packaged_workflows.py --diagnostics build/packaged-acceptance 2>&1
            foreach ($detail in $diagnostics) {
              $detail = ([string]$detail).Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
              Write-Output "::error title=Frozen acceptance checkpoint and stacks::$detail"
            }
          }
          exit $code
      - name: Verify real application updates and workspace recovery
        shell: pwsh
        run: |
          $output = & .venv-exe\Scripts\python.exe scripts/check_application_updates.py 2>&1
          $code = $LASTEXITCODE
          $output | Write-Output
          if ($code -ne 0) {
            $tail = ($output | Select-Object -Last 50) -join "`n"
            if ($tail.Length -gt 2600) { $tail = $tail.Substring($tail.Length - 2600) }
            $tail = $tail.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=Application update recovery failure::$tail"
          }
          exit $code
      - name: Prepare permanent native release evidence
        shell: pwsh
        run: |
          .venv-exe\Scripts\python.exe scripts/release_validation.py
          exit $LASTEXITCODE
      - name: Upload Windows downloads
        uses: actions/upload-artifact@v4
        with:
          name: ApplianceSignalStudio-Windows-v2.4.3
          path: |
            dist/ApplianceSignalStudio.exe
            dist/ApplianceSignalStudio_Portable.zip
            dist/ApplianceSignalStudio-Setup-*.exe
            dist/validation-v*.json
          if-no-files-found: error
          retention-days: 30
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Windows-build-diagnostics
          path: |
            build/build.log
            build/native-unit-tests.log
            build/*_smoke_report.json
            build/packaged-acceptance/**/packaged-acceptance.json
            build/packaged-acceptance/**/process-stderr.txt
            build/packaged-acceptance/**/process-result.json
            build/packaged-acceptance/**/acceptance.json
            build/packaged-acceptance/**/acceptance-stacks.txt
            build/packaged-acceptance/*.log
          if-no-files-found: ignore
      - name: Publish tested version to GitHub Releases
        if: success() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          .venv-exe\Scripts\python.exe scripts/release_manifest.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $version = .venv-exe\Scripts\python.exe -c "from app_version import VERSION; print(VERSION)"
          .venv-exe\Scripts\python.exe scripts/release_notes.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $draft = gh release view "v$version" --repo $env:GITHUB_REPOSITORY --json isDraft --jq '.isDraft' 2>$null
          if ($LASTEXITCODE -eq 0) {
            if ($draft -eq 'false') { Write-Output "Version already published; keeping immutable release."; exit 0 }
            $publication = & gh release upload "v$version" --repo $env:GITHUB_REPOSITORY --clobber dist/ApplianceSignalStudio.exe dist/ApplianceSignalStudio_Portable.zip dist/update.json dist/zip-update.json dist/installer-update.json "dist/ApplianceSignalStudio-Setup-$version.exe" "manuals/v$version.md" "dist/validation-v$version.json" 2>&1
          } else {
            $publication = & gh release create "v$version" --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --draft --title "Appliance Signal Studio $version" --notes-file dist/release-notes.md dist/ApplianceSignalStudio.exe dist/ApplianceSignalStudio_Portable.zip dist/update.json dist/zip-update.json dist/installer-update.json "dist/ApplianceSignalStudio-Setup-$version.exe" "manuals/v$version.md" "dist/validation-v$version.json" 2>&1
          }
          $publishCode = $LASTEXITCODE
          $publication | Write-Output
          if ($publishCode -ne 0) {
            $detail = (($publication | Select-Object -Last 12) -join "`n").Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=Release publication failure::$detail"
            exit $publishCode
          }
          gh release edit "v$version" --repo $env:GITHUB_REPOSITORY --draft=false --latest
          exit $LASTEXITCODE
