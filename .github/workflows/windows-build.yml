name: Build Windows application
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-exe:
    permissions:
      contents: write
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip
          cache-dependency-path: requirements-build.txt
      - name: Prepare build environment
        shell: pwsh
        run: |
          python -m venv .venv-exe
          .venv-exe\Scripts\python.exe -m pip install --only-binary=:all: -r requirements-build.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Check native updates and channel interactions
        shell: pwsh
        run: |
          $output = & .venv-exe\Scripts\python.exe -m unittest discover -s tests -p test_updates.py -v 2>&1
          $code = $LASTEXITCODE
          if ($code -eq 0) {
            $output += & .venv-exe\Scripts\python.exe -m unittest discover -s tests -p test_simplified_workbench.py -k test_checkbox_and_master -v 2>&1
            $code = $LASTEXITCODE
          }
          $output | Write-Output
          if ($code -ne 0) {
            $tail = ($output | Select-Object -Last 35) -join "`n"
            $tail = $tail.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=Native interaction test failure::$tail"
          }
          exit $code
      - name: Build and test portable and single-file executables
        shell: pwsh
        run: |
          .venv-exe\Scripts\python.exe build_exe.py --skip-install
          exit $LASTEXITCODE
      - name: Upload Windows downloads
        uses: actions/upload-artifact@v4
        with:
          name: ApplianceSignalStudio-Windows-v2.1.8
          path: |
            dist/ApplianceSignalStudio.exe
            dist/ApplianceSignalStudio_Portable.zip
          if-no-files-found: error
          retention-days: 30
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Windows-build-diagnostics
          path: |
            build/build.log
            build/*_smoke_report.json
          if-no-files-found: ignore
      - name: Publish tested version to GitHub Releases
        if: success() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          .venv-exe\Scripts\python.exe scripts/release_manifest.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $version = .venv-exe\Scripts\python.exe -c "from app_version import VERSION; print(VERSION)"
          $draft = gh release view "v$version" --repo $env:GITHUB_REPOSITORY --json isDraft --jq '.isDraft' 2>$null
          if ($LASTEXITCODE -eq 0) {
            if ($draft -eq 'false') { Write-Output "Version already published; keeping immutable release."; exit 0 }
            gh release upload "v$version" --repo $env:GITHUB_REPOSITORY --clobber dist/ApplianceSignalStudio.exe dist/ApplianceSignalStudio_Portable.zip dist/update.json "manuals/v$version.md"
          } else {
            gh release create "v$version" --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --draft --title "Appliance Signal Studio $version" --notes-file "manuals/v$version.md" dist/ApplianceSignalStudio.exe dist/ApplianceSignalStudio_Portable.zip dist/update.json "manuals/v$version.md"
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          gh release edit "v$version" --repo $env:GITHUB_REPOSITORY --draft=false --latest
          exit $LASTEXITCODE
