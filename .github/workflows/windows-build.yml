name: Build Windows application
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-exe:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip
          cache-dependency-path: requirements-build.txt
      - name: Prepare build environment
        shell: pwsh
        run: |
          python -m venv .venv-exe
          .venv-exe\Scripts\python.exe -m pip install --only-binary=:all: -r requirements-build.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build and test portable and single-file executables
        shell: pwsh
        run: |
          .venv-exe\Scripts\python.exe build_exe.py --skip-install
          exit $LASTEXITCODE
      - name: Upload Windows downloads
        uses: actions/upload-artifact@v4
        with:
          name: ApplianceSignalStudio-Windows-v2.1.3
          path: |
            dist/ApplianceSignalStudio.exe
            dist/ApplianceSignalStudio_Portable.zip
          if-no-files-found: error
          retention-days: 30
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Windows-build-diagnostics
          path: |
            build/build.log
            build/*_smoke_report.json
          if-no-files-found: ignore
